<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroAgenda - Atendimentos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
        // Conexão via proxy da Vercel (mesma origem do site): o navegador só fala com
        // o domínio do app e a Vercel repassa ao Supabase. Evita bloqueios de DNS/rede.
        const FIXED_SUPABASE_URL = window.location.origin;
const FIXED_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6dHdkeW1tcGZ6dGtqd2NoemZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzI5MzcsImV4cCI6MjEwNTE0ODkzN30.dgn59hXNZoDjwljZDO6XBUA3XIVhnaSyfpEtQi4ZTKs";
const TIME_SLOTS_40 = ["08:00 - 08:40","08:40 - 09:20","09:20 - 10:00","10:00 - 10:40","10:40 - 11:20","11:20 - 12:00","12:00 - 13:30","13:20 - 14:00","14:00 - 14:40","14:40 - 15:20","15:20 - 16:00","16:00 - 16:40","16:40 - 17:20","17:20 - 18:00","18:00 - 18:40","18:40 - 19:20"];
        const TIME_SLOTS_30 = ["07:30 - 08:00","08:00 - 08:30","08:30 - 09:00","09:00 - 09:30","09:30 - 10:00","10:00 - 10:30","10:30 - 11:00","11:00 - 11:30","11:30 - 12:00","12:00 - 12:30","12:30 - 13:00","13:00 - 13:30","13:30 - 14:00","14:00 - 14:30","14:30 - 15:00","15:00 - 15:30","15:30 - 16:00","16:00 - 16:30","16:30 - 17:00","17:00 - 17:30","17:30 - 18:00","18:00 - 18:30","18:30 - 19:00","19:00 - 19:30"];
        function isRestSlot(tp,sl){ return tp==='40min'&&sl==="12:00 - 13:30"; }
const DAYS = [{short:'Segunda'},{short:'Terça'},{short:'Quarta'},{short:'Quinta'},{short:'Sexta'}];
const PRICES = { terapia: 35, avaliacao: 55 };


async function hashPass(pwd){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('neuro$$'+pwd));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function App(){
  const [sb, setSb] = useState(null);
  const [professional, setProfessional] = useState(JSON.parse(localStorage.getItem('current_prof')||'null'));
  const [loginUser, setLoginUser] = useState('');
  const [loginPass, setLoginPass] = useState('');
  const [authError, setAuthError] = useState('');
  const [allProfs, setAllProfs] = useState([]);
  const [selProfId, setSelProfId] = useState(null);
  const [showCreate, setShowCreate] = useState(false);
  const [showManage, setShowManage] = useState(false);
  const [showChangePass, setShowChangePass] = useState(false);
  const [nName, setNName] = useState(''); const [nUser, setNUser] = useState(''); const [nPass, setNPass] = useState('');
  const [createMsg, setCreateMsg] = useState({type:'',text:''});
  const [pendingForce, setPendingForce] = useState(null);
  const [newPwd1, setNewPwd1] = useState(''); const [newPwd2, setNewPwd2] = useState('');
  const [curPwd, setCurPwd] = useState('');
  const [cycleStart, setCycleStart] = useState('2026-09-18');
  const [cycleEnd, setCycleEnd] = useState('2026-10-17');
  const [weekIdx, setWeekIdx] = useState(0);
  const [discount, setDiscount] = useState(false);
  const [sched, setSched] = useState({}); const [daily, setDaily] = useState({}); const [loading, setLoading] = useState(false);
  const [prices, setPrices] = useState({terapia:35, avaliacao:55});
  const [agendaType, setAgendaType] = useState('40min');
  const TIME_SLOTS = agendaType==='30min'?TIME_SLOTS_30:TIME_SLOTS_40;
  const [focusDay, setFocusDay] = useState(null);
  const [discountPct, setDiscountPct] = useState(15.33);
  const [savedSnap, setSavedSnap] = useState({});
  const [showHist, setShowHist] = useState(false);
  const [histList, setHistList] = useState([]);

  function sbFetch(input, init){
    init = init || {};
    var raw = (typeof input === 'string') ? input : input.url;
    var u = new URL(raw, window.location.origin);
    var path = u.pathname.replace(/^\/api\/sb/, '') + u.search;
    return fetch(window.location.origin + '/api/sb?target=' + encodeURIComponent(path), init);
  }

  useEffect(()=>{
    if(FIXED_SUPABASE_KEY && FIXED_SUPABASE_KEY!=="COLE_SUA_CHAVE_ANON_AQUI"){
      try{ setSb(window.supabase.createClient(window.location.origin + '/api/sb', FIXED_SUPABASE_KEY.trim(), { global: { fetch: sbFetch } })); }catch(e){ console.error(e); }
    }
  },[]);

  const weeks = useMemo(()=>{
    const s = new Date(cycleStart+'T00:00:00'); const e = new Date(cycleEnd+'T00:00:00');
    let curr = new Date(s); while(curr.getDay()!==1){ curr.setDate(curr.getDate()-1); }
    const ws=[]; while(curr<=e||ws.length<5){ const days=[]; for(let i=0;i<5;i++){ const d=new Date(curr); d.setDate(curr.getDate()+i); days.push({dateStr:d.toISOString().split('T')[0], formatted:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), dayOfWeek:DAYS[i].short, dateObj:d}); } ws.push({id:ws.length,start:days[0].formatted,end:days[4].formatted,days}); curr.setDate(curr.getDate()+7); if(curr>e&&ws.length>=4) break; }
    return ws;
  },[cycleStart,cycleEnd]);
  const curWeek = weeks[weekIdx]||weeks[0]||{days:[]};
  const enrichedDays = useMemo(()=>{
    const s = new Date(cycleStart+'T00:00:00').getTime();
    const e = new Date(cycleEnd+'T23:59:59').getTime();
    return (curWeek.days||[]).map(function(d){
      const t = d.dateObj.getTime();
      const out = t < s || t > e;
      const no = daily[d.dateStr] && daily[d.dateStr].noAttendance ? true : false;
      return { dateStr: d.dateStr, formatted: d.formatted, dayOfWeek: d.dayOfWeek, dateObj: d.dateObj, outCycle: out, isNo: no };
    });
  },[curWeek,cycleStart,cycleEnd,daily]);
  const activeId = useMemo(()=>{ if(!professional) return null; if(professional.role==='admin'&&selProfId) return selProfId; return professional.id; },[professional,selProfId]);
  const isAdmin = professional && professional.role==='admin';

  useEffect(()=>{ if(isAdmin&&sb) fetchProfs(); },[professional,sb]);
  const fetchProfs = async()=>{
    const {data,error} = await sb.from('professionals').select('*').order('name');
    if(!error&&data){ setAllProfs(data); if(data.length&&(!selProfId||!data.some(p=>p.id===selProfId))) setSelProfId(data[0].id); }
  };

  useEffect(()=>{ if(activeId&&sb) loadData(activeId); },[activeId,weekIdx,cycleStart,cycleEnd,sb]);

  const loadData = async(pid)=>{
    setLoading(true);
    try{
      const dates = curWeek.days.map(d=>d.dateStr);
      const {data:appts} = await sb.from('appointments').select('*').eq('professional_id',pid).in('date',dates);
      const ns={}; (appts||[]).forEach(a=>{ if(!ns[a.date]) ns[a.date]={}; ns[a.date][a.time_slot]={patientName:a.patient_name||'',type:a.appointment_type||'terapia',status:a.status||'atendido',value:a.value}; }); setSched(ns); setSavedSnap(JSON.parse(JSON.stringify(ns)));
      const {data:sett} = await sb.from('daily_settings').select('*').eq('professional_id',pid).in('date',dates);
      const nd={}; (sett||[]).forEach(s=>{ nd[s.date]={noAttendance:s.no_attendance}; }); setDaily(nd);
      const {data:pset} = await sb.from('professional_settings').select('*').eq('professional_id',pid).single();
      if(pset){ setPrices({terapia:Number(pset.terapia_price)||0, avaliacao:Number(pset.avaliacao_price)||0}); if(pset.agenda_type){ setAgendaType(pset.agenda_type); } } else { setPrices({terapia:35, avaliacao:55}); setAgendaType('40min'); }
    }catch(e){ console.error(e); }
    setLoading(false);
  };

  const saveAll = async(ns,nd)=>{
    setSched(ns); setDaily(nd); setSavedSnap(JSON.parse(JSON.stringify(ns))); if(!sb||!activeId) return;
    for(const date of Object.keys(ns)){ for(const slot of Object.keys(ns[date])){ const it=ns[date][slot]; await sb.from('appointments').upsert({professional_id:activeId,date,time_slot:slot,patient_name:it.patientName,appointment_type:it.type,status:it.status,value:((it.value===null||it.value===undefined||it.value==='')?(it.type==='terapia'?prices.terapia:prices.avaliacao):Number(it.value))},{onConflict:'professional_id,date,time_slot'}); } }
    for(const date of Object.keys(nd)){ await sb.from('daily_settings').upsert({professional_id:activeId,date,no_attendance:nd[date].noAttendance},{onConflict:'professional_id,date'}); }
  };
  const updSlot = (ds,slot,f,v)=>{ const ns=JSON.parse(JSON.stringify(sched)); if(!ns[ds]) ns[ds]={}; if(!ns[ds][slot]) ns[ds][slot]={patientName:'',type:'terapia',status:'atendido'}; ns[ds][slot][f]=v; if(f==='patientName'){ setSched(ns); } else { saveAll(ns,daily); } };
  const confirmName = async(ds,slot)=>{ const cur=((sched[ds]&&sched[ds][slot]&&sched[ds][slot].patientName)||''); const old=((savedSnap[ds]&&savedSnap[ds][slot]&&savedSnap[ds][slot].patientName)||''); if(cur===old) return; if(!old){ saveAll(sched,daily); return; } const ok=confirm('Confirmar alteração do paciente de "'+old+'" para "'+cur+'"?'); if(ok){ try{ await sb.from('appointment_history').insert([{professional_id:activeId,date:ds,time_slot:slot,old_patient_name:old,new_patient_name:cur,changed_by:professional.username}]); }catch(e){ console.error(e); } saveAll(sched,daily); } else { const ns=JSON.parse(JSON.stringify(sched)); ns[ds][slot].patientName=old; setSched(ns); } };
  const updValLocal = (ds,slot,nv)=>{ const ns=JSON.parse(JSON.stringify(sched)); if(!ns[ds]) ns[ds]={}; if(!ns[ds][slot]) ns[ds][slot]={patientName:'',type:'terapia',status:'atendido'}; ns[ds][slot].value=nv; setSched(ns); };
  const confirmVal = (ds,slot)=>{ const entry=(sched[ds]&&sched[ds][slot])||null; const sn=(savedSnap[ds]&&savedSnap[ds][slot])||null; const hasOld=!!(sn&&(sn.value!==null&&sn.value!==undefined&&sn.value!=='')); const old=hasOld?Number(sn.value):null; if(!entry&&!hasOld) return; const cur=entry?(Number(entry.value)||0):0; if(old!==null&&cur===old) return; const oldTxt=(old===null)?'o valor da tabela':('R$ '+old.toFixed(2).replace('.',',')); const ok=confirm('Administrador: alterar valor deste atendimento de '+oldTxt+' para R$ '+cur.toFixed(2).replace('.',',')+'?'); if(ok){ saveAll(sched,daily); } else { const ns=JSON.parse(JSON.stringify(sched)); if(!ns[ds]) ns[ds]={}; if(!ns[ds][slot]) ns[ds][slot]={patientName:'',type:'terapia',status:'atendido'}; if(hasOld){ ns[ds][slot].value=sn.value; } else { delete ns[ds][slot].value; } setSched(ns); } };
  const fetchHist = async()=>{ if(!sb||!activeId) return; const {data}=await sb.from('appointment_history').select('*').eq('professional_id',activeId).order('created_at',{ascending:false}).limit(200); setHistList(data||[]); setShowHist(true); };
  const togDay = (ds,c)=>{ const nd=JSON.parse(JSON.stringify(daily)); if(!nd[ds]) nd[ds]={}; nd[ds].noAttendance=c; saveAll(sched,nd); };
  const slotVal = (it,tp)=>{ const v=(it.value===null||it.value===undefined||it.value==='')?(tp==='terapia'?prices.terapia:prices.avaliacao):Number(it.value); return v||0; };
  const savePrices = async(nt,na)=>{ const np={terapia:nt,avaliacao:na}; setPrices(np); if(!sb||!activeId) return; try{ await sb.from('professional_settings').upsert({professional_id:activeId,terapia_price:nt,avaliacao_price:na},{onConflict:'professional_id'}); }catch(e){ console.error(e); } };
  const saveAgendaType = async(tp)=>{ setAgendaType(tp); if(!sb||!activeId) return; try{ await sb.from('professional_settings').upsert({professional_id:activeId,agenda_type:tp},{onConflict:'professional_id'}); }catch(e){ console.error(e); } };

  const doLogin = async(e)=>{
    e.preventDefault(); setAuthError('');

    if(!sb){ setAuthError('Banco não conectado. Configure a chave Anon no código.'); return; }
    let data = null;
    try{
      const res = await sb.from('professionals').select('*').eq('username',loginUser.trim()).single();
      if(res.error||!res.data){ setAuthError('Usuário ou senha incorretos.'); return; }
      data = res.data;
    }catch(err){ setAuthError('Sem conexão com o banco de dados. Verifique sua internet/DNS e tente de novo.'); return; }
    const h = await hashPass(loginPass);
    if(h!==data.password_hash){ setAuthError('Usuário ou senha incorretos.'); return; }
    if(data.must_change_password){ setPendingForce(data); setNewPwd1(''); setNewPwd2(''); return; }
    const p={id:data.id,name:data.name,username:data.username,role:(data.username==='administrador'?'admin':'professional')}; setProfessional(p); localStorage.setItem('current_prof',JSON.stringify(p));
  };

  const doForceChange = async(e)=>{
    e.preventDefault();
    if(!newPwd1||newPwd1.length<4){ setAuthError('Nova senha deve ter ao menos 4 caracteres.'); return; }
    if(newPwd1!==newPwd2){ setAuthError('Confirmação não confere.'); return; }
    const h = await hashPass(newPwd1);
    const {error} = await sb.from('professionals').update({password_hash:h,must_change_password:false}).eq('id',pendingForce.id);
    if(error){ setAuthError(error.message); return; }
    const p={id:pendingForce.id,name:pendingForce.name,username:pendingForce.username,role:(pendingForce.username==='administrador'?'admin':'professional')}; setProfessional(p); localStorage.setItem('current_prof',JSON.stringify(p)); setPendingForce(null); setAuthError('');
  };

  const doCreate = async(e)=>{
    e.preventDefault(); setCreateMsg({type:'',text:''});
    if(!nName||!nUser||!nPass){ setCreateMsg({type:'error',text:'Preencha todos os campos.'}); return; }
    const h = await hashPass(nPass);
    const {error} = await sb.from('professionals').insert([{name:nName,username:nUser.trim(),password_hash:h,must_change_password:true}]);
    if(error){ setCreateMsg({type:'error',text:error.message}); } else { setCreateMsg({type:'success',text:'Usuário '+nUser+' criado! Ele trocará a senha no primeiro acesso.'}); setNName('');setNUser('');setNPass(''); fetchProfs(); }
  };

  const doDelete = async(id,name)=>{ if(!confirm('Excluir '+name+'?')) return; await sb.from('appointments').delete().eq('professional_id',id); await sb.from('daily_settings').delete().eq('professional_id',id); const {error}=await sb.from('professionals').delete().eq('id',id); if(error) alert(error.message); else fetchProfs(); };
  const doReset = async(id,name)=>{ const np=prompt('Nova senha temporária para '+name+':','123456'); if(!np) return; const h=await hashPass(np); const {error}=await sb.from('professionals').update({password_hash:h,must_change_password:true}).eq('id',id); if(error) alert(error.message); else alert('Senha resetada. Usuário trocará no próximo acesso.'); };

  const doChangeOwn = async(e)=>{
    e.preventDefault(); setAuthError('');
    if(newPwd1!==newPwd2){ setAuthError('Confirmação não confere.'); return; }
    const {data}=await sb.from('professionals').select('*').eq('id',professional.id).single();
    const hc=await hashPass(curPwd); if(hc!==data.password_hash){ setAuthError('Senha atual incorreta.'); return; }
    const h=await hashPass(newPwd1); await sb.from('professionals').update({password_hash:h,must_change_password:false}).eq('id',professional.id);
    setShowChangePass(false); setCurPwd(''); setNewPwd1(''); setNewPwd2(''); alert('Senha alterada!');
  };

  const fin = useMemo(()=>{
    let tc=0,ac=0,tt=0,at=0; const s=new Date(cycleStart+'T00:00:00'),en=new Date(cycleEnd+'T23:59:59');
    weeks.forEach(w=>w.days.forEach(d=>{ if(d.dateObj>=s&&d.dateObj<=en){ const ds=sched[d.dateStr]||{}; if(!(daily[d.dateStr] && daily[d.dateStr].noAttendance)){                                 TIME_SLOTS.forEach(sl=>{ const it=ds[sl]; if(it&&!isRestSlot(agendaType,sl)&&(it.status==='atendido'||it.status==='faltou_remunerada')){ if(it.type==='terapia'){tc++; tt+=slotVal(it,'terapia');} else {ac++; at+=slotVal(it,'avaliacao');} } }); } } }));
    const sub=tt+at, g=sub-(discount?sub*discountPct/100:0);
    return {tc,tt,ac,at,sub,g,tot:tc+ac};
  },[sched,daily,weeks,cycleStart,cycleEnd,discount,prices,discountPct,agendaType]);

  if(pendingForce){
    return (<div className="min-h-screen bg-slate-900 flex items-center justify-center p-4"><div className="bg-white rounded-2xl max-w-md w-full p-6">
      <h2 className="font-bold text-lg">Primeiro acesso — Troque sua senha</h2>
      <p className="text-xs text-slate-500 mb-4">Usuário <b>{pendingForce.username}</b> precisa definir uma nova senha.</p>
      {authError&&<div className="mb-3 p-2 bg-red-50 text-red-600 text-xs rounded">{authError}</div>}
      <form onSubmit={doForceChange} className="space-y-3">
        <input type="password" value={newPwd1} onChange={e=>setNewPwd1(e.target.value)} placeholder="Nova senha" className="w-full border rounded-lg px-3 py-2 text-sm"/>
        <input type="password" value={newPwd2} onChange={e=>setNewPwd2(e.target.value)} placeholder="Confirmar nova senha" className="w-full border rounded-lg px-3 py-2 text-sm"/>
        <button className="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold">Salvar nova senha</button>
      </form></div></div>);
  }

  if(!professional){
    return (<div className="min-h-screen bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-950 flex items-center justify-center p-4"><div className="bg-white rounded-2xl w-full max-w-md p-8">
      <div className="text-center mb-6"><div className="inline-flex w-14 h-14 bg-indigo-600 text-white rounded-2xl items-center justify-center text-xl"><i className="fa-solid fa-brain"></i></div>
      <h1 className="text-xl font-bold mt-2">NeuroAgenda</h1><p className="text-xs text-slate-500">Login por usuário • 100% Supabase</p></div>
      {FIXED_SUPABASE_KEY==="COLE_SUA_CHAVE_ANON_AQUI"&&<div className="mb-3 p-2 bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded">Configure FIXED_SUPABASE_KEY no index.html com a chave anon (Legacy).</div>}
      {authError&&<div className="mb-3 p-2 bg-red-50 border border-red-200 text-red-600 text-xs rounded">{authError}</div>}
      <form onSubmit={doLogin} className="space-y-3">
        <div><label className="text-xs font-bold">USUÁRIO</label><input value={loginUser} onChange={e=>setLoginUser(e.target.value)} required placeholder="ex: joao.silva" className="w-full border rounded-xl px-4 py-2.5 text-sm"/></div>
        <div><label className="text-xs font-bold">SENHA</label><input type="password" value={loginPass} onChange={e=>setLoginPass(e.target.value)} required placeholder="••••••" className="w-full border rounded-xl px-4 py-2.5 text-sm"/></div>
        <button className="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold text-sm">Entrar</button>
      </form>
      <p className="text-[11px] text-slate-500 mt-3 text-center">Primeiro acesso? Use a senha temporária criada pelo admin e troque na hora.</p>
    </div></div>);
  }

  return (<div className="min-h-screen bg-slate-100 flex flex-col">
    <header className="bg-slate-900 text-white"><div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-3">
      <div className="flex items-center gap-2"><div className="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center"><i className="fa-solid fa-brain"></i></div>
      <div><h1 className="font-bold">NeuroAgenda</h1><p className="text-[11px] text-indigo-300">{isAdmin?<span className="text-amber-400 font-semibold">{professional.name} (Acesso Total)</span>:<span><b className="text-white">{professional.name}</b> <span className="text-indigo-300">@{professional.username}</span></span>}</p></div></div>
      {isAdmin&&<div className="flex items-center gap-2 flex-wrap">
        <select value={selProfId||''} onChange={e=>setSelProfId(e.target.value)} className="bg-slate-800 text-xs px-2 py-1.5 rounded-lg border border-slate-700">{allProfs.map(p=><option key={p.id} value={p.id}>{p.name} ({p.username})</option>)}</select>
        <button onClick={()=>setShowCreate(true)} className="bg-indigo-600 text-xs px-3 py-2 rounded-xl font-semibold"><i className="fa-solid fa-user-plus mr-1"></i>Novo Usuário</button>
        <button onClick={()=>{fetchProfs();setShowManage(true);}} className="bg-slate-800 border border-slate-700 text-xs px-3 py-2 rounded-xl">Gerenciar / Excluir</button>
      </div>}
      <div className="flex items-center gap-2">
        {!isAdmin&&<button onClick={()=>setShowChangePass(true)} className="text-xs bg-slate-800 px-3 py-2 rounded-lg border border-slate-700"><i className="fa-solid fa-key mr-1"></i>Trocar senha</button>}
        <span className="text-[11px] bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-lg border border-emerald-500/30">{sb?'Supabase Conectado':'Sem banco'}</span>
        <button onClick={()=>{setProfessional(null);localStorage.removeItem('current_prof');}} className="bg-red-500/20 text-red-300 text-xs px-3 py-2 rounded-lg">Sair</button>
      </div>
    </div></header>
    <main className="max-w-7xl mx-auto px-4 py-5 w-full space-y-5">
      <div className="bg-white rounded-2xl p-4 border flex flex-wrap justify-between gap-3">
        <div className="flex gap-3 flex-wrap">
          <label className="text-xs font-bold bg-indigo-50 border border-indigo-200 px-3 py-2 rounded-xl">Início: <input type="date" value={cycleStart} onChange={e=>setCycleStart(e.target.value)} className="bg-white border rounded ml-1 text-xs px-1"/></label>
          <label className="text-xs font-bold bg-indigo-50 border border-indigo-200 px-3 py-2 rounded-xl">Fim: <input type="date" value={cycleEnd} onChange={e=>setCycleEnd(e.target.value)} className="bg-white border rounded ml-1 text-xs px-1"/></label>
          <label className="text-xs font-bold bg-emerald-50 border border-emerald-200 px-3 py-2 rounded-xl">Terapia R$: <input type="number" min="0" step="0.01" value={prices.terapia} onChange={e=>savePrices(parseFloat(e.target.value)||0, prices.avaliacao)} className="bg-white border rounded ml-1 text-xs px-1 w-20"/></label>
          <label className="text-xs font-bold bg-emerald-50 border border-emerald-200 px-3 py-2 rounded-xl">Avaliação R$: <input type="number" min="0" step="0.01" value={prices.avaliacao} onChange={e=>savePrices(prices.terapia, parseFloat(e.target.value)||0)} className="bg-white border rounded ml-1 text-xs px-1 w-20"/></label>
          <label className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl text-xs font-bold text-slate-600">Agenda: <select value={agendaType} onChange={e=>saveAgendaType(e.target.value)} className="bg-white border border-slate-300 rounded-lg text-xs font-bold px-2 py-1 focus:outline-none"><option value="40min">40 min</option><option value="30min">30 min</option></select></label>
        </div>
        <div className="flex gap-2 items-center overflow-x-auto"><span className="text-xs font-bold text-slate-500">Semana:</span>{weeks.map((w,i)=><button key={i} onClick={()=>setWeekIdx(i)} className={`px-3 py-1.5 rounded-xl text-xs font-semibold ${weekIdx===i?'bg-indigo-600 text-white':'bg-slate-100'}`}>S{i+1} ({w.start}-{w.end})</button>)}</div>
      </div>
      <div className="bg-slate-900 text-white rounded-2xl p-5">
        <div className="flex flex-col lg:flex-row justify-between gap-4">
          <div><span className="text-[11px] bg-indigo-500/20 border border-indigo-500/30 px-2 py-1 rounded-full">CICLO {cycleStart.split('-').reverse().join('/')} ATÉ {cycleEnd.split('-').reverse().join('/')}</span>
          <h2 className="text-xl font-extrabold mt-1">Total a Receber</h2></div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="bg-white/5 border border-white/10 rounded-xl p-3 text-center"><p className="text-[11px] text-slate-400">Terapias R$ {Number(prices.terapia).toFixed(2).replace('.',',')}</p><p className="font-bold text-emerald-400">{fin.tc}</p><p className="text-xs">R$ {fin.tt.toFixed(2).replace('.',',')}</p></div>
            <div className="bg-white/5 border border-white/10 rounded-xl p-3 text-center"><p className="text-[11px] text-slate-400">Avaliações R$ {Number(prices.avaliacao).toFixed(2).replace('.',',')}</p><p className="font-bold text-indigo-300">{fin.ac}</p><p className="text-xs">R$ {fin.at.toFixed(2).replace('.',',')}</p></div>
            <div className="bg-white/5 border border-white/10 rounded-xl p-3 text-center"><p className="text-[11px] text-slate-400">Atendimentos</p><p className="font-bold text-xl">{fin.tot}</p></div>
            <div className="bg-indigo-600/30 border border-indigo-500/50 rounded-xl p-3 text-center"><p className="text-[11px]">TOTAL</p><p className="font-extrabold text-emerald-300">R$ {fin.g.toFixed(2).replace('.',',')}</p></div>
          </div>
        </div>
        <div className="mt-4 pt-3 border-t border-white/10 flex items-center gap-2 flex-wrap text-sm">
          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={discount} onChange={e=>setDiscount(e.target.checked)} className="w-4 h-4"/><span className="font-bold">Desconto de Serviço</span></label>
          <input type="number" min="0" max="100" step="0.01" value={discountPct} onChange={e=>setDiscountPct(parseFloat(e.target.value)||0)} className="w-20 px-2 py-1 rounded-lg bg-white/10 border border-white/20 text-white font-bold"/>
          <span className="font-bold">%</span>
          <span className="text-xs text-slate-400 ml-auto">Subtotal: R$ {fin.sub.toFixed(2).replace('.',',')}</span>
        </div>
      </div>
      <div className="bg-white rounded-2xl border overflow-hidden">
        <div className="bg-slate-900 text-white px-4 py-3 text-sm font-bold flex justify-between items-center"><span>Agenda {agendaType==='30min' ? '30 min' : '40 min'} — Semana {weekIdx+1} ({curWeek.start} a {curWeek.end})</span><button onClick={fetchHist} className="text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg font-semibold"><i className="fa-solid fa-clock-rotate-left mr-1"></i>Histórico de alterações</button></div>
        {loading?<div className="p-8 text-center text-sm text-slate-500">Carregando...</div>:<div className="overflow-auto max-h-[75vh]"><table className="w-full text-sm">
          <thead><tr className="bg-slate-100 text-xs uppercase"><th className="p-2 border-r w-28 sticky left-0 top-0 z-20 bg-slate-100">Horário</th>{enrichedDays.map(function(d){ return (<th key={d.dateStr} className={'p-2 border-r min-w-[220px] sticky top-0 z-10 ' + (focusDay===d.dateStr ? 'bg-emerald-100' : 'bg-slate-100')}><span className={focusDay===d.dateStr ? 'font-extrabold text-emerald-800' : ''}>{d.dayOfWeek} ({d.formatted})</span> {d.outCycle ? (<span className="text-[10px] bg-amber-100 px-1 rounded">Fora</span>) : null}<br/><label className="text-[10px] font-normal normal-case bg-white border rounded px-1 py-0.5"><input type="checkbox" checked={d.isNo} onChange={e=>togDay(d.dateStr,e.target.checked)}/> Não há atendimento</label></th>)})}</tr></thead>
          <tbody>{TIME_SLOTS.map(sl=>{const rest=isRestSlot(agendaType,sl); return (<tr key={sl} className="border-t"><td className="p-2 text-center text-xs font-bold border-r bg-slate-50 sticky left-0 z-[5]">{sl}{rest&&<div className="text-amber-600">Descanso</div>}</td>{enrichedDays.map(function(d){const daySched=sched[d.dateStr]; const sd=(daySched && daySched[sl]) || {patientName:'',type:'terapia',status:'atendido'}; if(d.isNo||rest) return (<td key={d.dateStr} className={'p-2 border-r text-[11px] italic text-slate-400 text-center ' + (focusDay===d.dateStr ? 'bg-emerald-100/70' : 'bg-slate-100')}>{d.isNo?'Dia inativo':'Descanso'}</td>); const cnt=sd.status==='atendido'||sd.status==='faltou_remunerada'; const val=slotVal(sd,sd.type); return (<td key={d.dateStr} className={'p-1.5 border-r align-top ' + (focusDay===d.dateStr ? 'bg-emerald-50' : '')}><div className="border rounded-xl p-2 space-y-1.5 bg-white">
            <input value={sd.patientName} onChange={e=>updSlot(d.dateStr,sl,'patientName',e.target.value)} onFocus={()=>setFocusDay(d.dateStr)} onBlur={()=>{setFocusDay(null); confirmName(d.dateStr,sl);}} placeholder="Paciente" className="w-full text-xs border rounded px-2 py-1 bg-slate-50"/>
            <select value={sd.type} onChange={e=>updSlot(d.dateStr,sl,'type',e.target.value)} onFocus={()=>setFocusDay(d.dateStr)} onBlur={()=>setFocusDay(null)} className="w-full text-xs border rounded px-1 py-1 bg-indigo-50 font-semibold"><option value="terapia">Terapia R$ {Number(prices.terapia).toFixed(2).replace('.',',')}</option><option value="avaliacao">Avaliação R$ {Number(prices.avaliacao).toFixed(2).replace('.',',')}</option></select>
            <select value={sd.status} onChange={e=>updSlot(d.dateStr,sl,'status',e.target.value)} onFocus={()=>setFocusDay(d.dateStr)} onBlur={()=>setFocusDay(null)} className="w-full text-xs border rounded px-1 py-1 font-semibold"><option value="atendido">✓ Atendido</option><option value="faltou_remunerada">⚡ Faltou (Remun.)</option><option value="faltou_nao_remunerada">✕ Faltou (Não rem.)</option><option value="inativo">— Sem atend.</option></select>
            <div className="text-[11px] flex justify-between items-center"><span className="text-slate-400">Valor:</span>{isAdmin ? (<input type="number" min="0" step="0.01" value={Number(val)||0} onChange={e=>updValLocal(d.dateStr,sl,parseFloat(e.target.value)||0)} onBlur={()=>confirmVal(d.dateStr,sl)} title="Somente administrador pode alterar" className="w-20 text-right font-bold text-emerald-700 border border-emerald-300 rounded px-1"/>) : (<b className={cnt?'text-emerald-600':'text-slate-400 line-through'}>R$ {val.toFixed(2).replace('.',',')}</b>)}</div>
          </div></td>)})}</tr>)})}</tbody>
        </table></div>}
      </div>
    </main>
    {showCreate&&<div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50"><div className="bg-white rounded-2xl max-w-md w-full p-5">
      <h3 className="font-bold">Novo usuário (profissional)</h3><p className="text-xs text-slate-500 mb-3">Cria usuário + senha temporária. Ele troca no 1º acesso.</p>
      {createMsg.text&&<div className={`text-xs p-2 rounded mb-2 ${createMsg.type==='error'?'bg-red-50 text-red-600':'bg-emerald-50 text-emerald-700'}`}>{createMsg.text}</div>}
      <form onSubmit={doCreate} className="space-y-2"><input value={nName} onChange={e=>setNName(e.target.value)} placeholder="Nome" required className="w-full border rounded-lg px-3 py-2 text-sm"/><input value={nUser} onChange={e=>setNUser(e.target.value)} placeholder="usuário ex: joao.silva" required className="w-full border rounded-lg px-3 py-2 text-sm"/><input type="password" value={nPass} onChange={e=>setNPass(e.target.value)} placeholder="Senha temporária" required className="w-full border rounded-lg px-3 py-2 text-sm"/>
      <div className="flex justify-end gap-2"><button type="button" onClick={()=>setShowCreate(false)} className="text-sm px-3 py-2">Fechar</button><button className="bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg">Criar</button></div></form></div></div>}
    {showManage&&<div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50"><div className="bg-white rounded-2xl max-w-lg w-full p-5">
      <h3 className="font-bold mb-2">Gerenciar usuários</h3><div className="max-h-80 overflow-auto border rounded-xl divide-y">{allProfs.map(p=>(<div key={p.id} className="p-2 flex justify-between items-center"><div><p className="text-sm font-bold">{p.name}</p><p className="text-xs text-slate-500">{p.username}{p.must_change_password?' • troca pendente':''}</p></div><div className="flex gap-1"><button onClick={()=>doReset(p.id,p.name)} className="text-xs bg-amber-50 border border-amber-200 px-2 py-1 rounded">Resetar</button><button onClick={()=>doDelete(p.id,p.name)} className="text-xs bg-red-50 border border-red-200 text-red-600 px-2 py-1 rounded">Excluir</button></div></div>))}</div>
      <div className="text-right mt-3"><button onClick={()=>setShowManage(false)} className="bg-slate-800 text-white text-sm px-4 py-2 rounded-lg">Fechar</button></div></div></div>}
    {showChangePass&&<div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50"><div className="bg-white rounded-2xl max-w-md w-full p-5">
      <h3 className="font-bold mb-2">Trocar minha senha</h3>{authError&&<div className="text-xs bg-red-50 text-red-600 p-2 rounded mb-2">{authError}</div>}
      <form onSubmit={doChangeOwn} className="space-y-2"><input type="password" value={curPwd} onChange={e=>setCurPwd(e.target.value)} placeholder="Senha atual" required className="w-full border rounded-lg px-3 py-2 text-sm"/><input type="password" value={newPwd1} onChange={e=>setNewPwd1(e.target.value)} placeholder="Nova senha" required className="w-full border rounded-lg px-3 py-2 text-sm"/><input type="password" value={newPwd2} onChange={e=>setNewPwd2(e.target.value)} placeholder="Confirmar" required className="w-full border rounded-lg px-3 py-2 text-sm"/>
      <div className="flex justify-end gap-2"><button type="button" onClick={()=>setShowChangePass(false)} className="text-sm px-3 py-2">Fechar</button><button className="bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg">Salvar</button></div></form></div></div>}
    {showHist&&<div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50"><div className="bg-white rounded-2xl max-w-lg w-full p-5">
      <div className="flex justify-between items-center mb-2"><h3 className="font-bold">Histórico de alterações de pacientes</h3><button onClick={()=>setShowHist(false)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button></div>
      <p className="text-xs text-slate-500 mb-3">Registro oculto de quem alterou nomes de pacientes. Visível somente aqui.</p>
      <div className="max-h-80 overflow-auto border rounded-xl divide-y">{histList.map(h=>(<div key={h.id} className="p-2 text-xs"><p className="font-bold text-slate-800">{h.date.split('-').reverse().join('/')} • {h.time_slot}</p><p className="text-slate-600">"{h.old_patient_name}" → "{h.new_patient_name}"</p><p className="text-slate-400">por {h.changed_by} em {new Date(h.created_at).toLocaleString('pt-BR')}</p></div>))}{histList.length===0&&<div className="p-4 text-center text-xs text-slate-400">Nenhuma alteração registrada.</div>}</div>
      <div className="text-right mt-3"><button onClick={()=>setShowHist(false)} className="bg-slate-800 text-white text-sm px-4 py-2 rounded-lg">Fechar</button></div></div></div>}
    <footer className="bg-slate-900 text-white text-center text-[11px] py-3">NeuroAgenda • Usuário + senha hash • Supabase</footer>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
